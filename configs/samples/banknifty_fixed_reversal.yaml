underlying: BANKNIFTY
tick_size: 0.05
source:
  timeframe_minutes: 5
  candle_input: close
  signal_contract: front_month_futures
  rollover_policy: warm_next_preserve_rebase
renko:
  box_mode: fixed_points
  fixed_points: 100
  atr_period: 14
  atr_multiplier: 1.0
  reversal_boxes: 2
signal:
  mode: reversal
  ema_period: 10
  continuation_anchor: ema_regime
  pullback_min_boxes: 1
  pullback_max_boxes: 3
risk:
  initial_stops:
    - type: entry_percent
      value: 0.5
    - type: box_offset
      value: 3
  trailing_stops:
    - type: atr_from_brick
      multiplier: 2.0
    - type: opposite_boxes
      boxes: 2
    - type: price_box_offset
      boxes: 3
execution:
  instrument: synthetic_futures
  expiry: monthly
  lots: 2
  holding: positional
  max_entries_per_day: null
  entry_cutoff: null
  intraday_exit: "15:28"
